<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="protick-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3B" />
      <stop offset="50%" stop-color="#123B70" />
      <stop offset="100%" stop-color="#1E56A0" />
    </linearGradient>
    <linearGradient id="protick-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="protick-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="protick-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with shadow -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#protick-bg)" filter="url(#protick-shadow)" />

  <!-- Subtle border outline -->
  <rect x="6.75" y="6.75" width="86.5" height="86.5" rx="21.25" fill="none" stroke="url(#protick-border)" stroke-width="1.5" />

  <!-- Decorative subtle tech grid / radar lines -->
  <circle cx="50" cy="50" r="30" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="20" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />

  <!-- ProTick Checkmark -->
  <path d="M28 52 L43 67 L74 34" stroke="url(#protick-check)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Secure Terminal Status Dot -->
  <circle cx="76" cy="24" r="3.5" fill="#34D399" />
  <circle cx="76" cy="24" r="6" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5" />
</svg>
